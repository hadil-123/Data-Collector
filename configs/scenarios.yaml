# Liste des scénarios
#
# D1/D2/D3, T1 et T3 (anciennes versions) ont été fusionnés en un seul
# scénario "routine libre" : dans une activité quotidienne réelle, marcher,
# s'arrêter, s'asseoir et changer de pièce ne sont pas des comportements
# distincts qu'on dirige séparément, mais une seule séquence continue.
# T2 reste séparé : ce n'est pas un mouvement mais une condition de test
# distincte (occlusion par un meuble).
scenarios:
  # Déplacement (D)
  - id: D1
    label: "Routine de déplacement naturelle (marche, arrêts, assise, entrées/sorties, changements de zone)"
    category: "Déplacement"
    zone: "Z1 ↔ Z2"
    difficulty: "facile à intermédiaire"
    num_people: 1

  # Occlusion (T)
  - id: T2
    label: "Occlusion naturelle par mobilier"
    category: "Arrêt"
    zone: "Z2"
    difficulty: "intermédiaire à difficile"
    num_people: 1

  # Activités (A)
  - id: A1
    label: "Entrer avec un sac d'épicerie"
    category: "Activités"
    zone: "Z1"
    difficulty: "intermédiaire"
    num_people: 1
    
  - id: A2
    label: "Vider / ranger l'épicerie"
    category: "Activités"
    zone: "Z1"
    difficulty: "difficile"
    num_people: 1
    
  - id: A3
    label: "Interaction avec le réfrigérateur (porte = occlusion)"
    category: "Activités"
    zone: "Z1"
    difficulty: "difficile"
    num_people: 1

  - id: A4
    label: "Se pencher / s'accroupir pour ramasser un objet au sol"
    category: "Activités"
    zone: "Z1 ↔ Z2"
    difficulty: "intermédiaire"
    num_people: 1

  - id: A5
    label: "Balayer ou passer l'aspirateur"
    category: "Activités"
    zone: "Z1 ↔ Z2"
    difficulty: "intermédiaire"
    num_people: 1

  # Multi-personnes (M)
  - id: M1
    label: "Croisement naturel"
    category: "Multi-personnes"
    zone: "Z2"
    difficulty: "difficile"
    num_people: 2
    
  - id: M2
    label: "Marche côte à côte (proximité)"
    category: "Multi-personnes"
    zone: "Z2"
    difficulty: "difficile"
    num_people: 2
    
  - id: M3
    label: "Deux personnes effectuant la même activité (cuisine)"
    category: "Multi-personnes"
    zone: "Z1"
    difficulty: "très difficile"
    num_people: 2
# ...
